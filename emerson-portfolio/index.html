<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#191a1d" />
    <meta name="description" content="Portfólio de Emerson Brandão — Web Designer e Desenvolvedor em Feira de Santana, Bahia." />
    <script>
      (() => { let theme = "dark"; try { const saved = localStorage.getItem("emerson-theme"); if (saved === "light" || saved === "dark") theme = saved; } catch {} document.documentElement.dataset.theme = theme; document.documentElement.classList.toggle("dark", theme === "dark"); document.querySelector('meta[name="theme-color"]').content = theme === "dark" ? "#090a0b" : "#eeede8"; })();
    </script>
    <title>Emerson Brandão — Web Design &amp; Desenvolvimento</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
